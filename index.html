/* ================= EXERCISE CUSTOMIZATION =================
   Prescribed sets are plain strings ("Bench Press 4x8"), so the exercise name
   and the sets×reps token are recovered by parsing at render time rather than
   being stored apart. FUTURE CLEANUP: migrating WORKOUTS_SPECIALIZED to
   structured { exercise, sets, reps } objects would remove this parsing step
   entirely, but it rewrites 80+ workout definitions — worth its own pass. */

/* "Bulgarian Split Squat 3x8 each" -> {name:'Bulgarian Split Squat', sets:3, reps:'8', suffix:' each'}
   Lines with no trailing NxM token ("Rest 30s", "Sprint up stairs") come back
   with sets:null and are rendered as-is. */
const SET_LINE = /^(.*?)\s+(\d+)\s*[x×]\s*([A-Za-z0-9][A-Za-z0-9\-–]*)(\s+each)?$/;
function parseSetLine(line){
  const m = String(line).match(SET_LINE);
  if (!m) return { name:String(line), sets:null, reps:null, suffix:'' };
  return { name:m[1], sets:+m[2], reps:m[3], suffix:m[4] || '' };
}
/* arsenal spec strings: "4x6-8", "3xAMRAP", "5x5", "3x12 each", "2-3min" */
function parseSpec(spec){
  const m = String(spec || '').match(/^(\d+)\s*[x×]\s*([A-Za-z0-9][A-Za-z0-9\-–]*)(\s+each)?$/);
  return m ? { sets:+m[1], reps:m[2] } : { sets:3, reps:'10' };
}

/* one lookup, shared by pageDetail, "Mark Complete" and the swap actions */
function findWorkout(g, name){
  const spec = WORKOUTS_SPECIALIZED[g];
  if (!spec) return null;
  for (const cat of Object.values(spec)){
    const w = cat.find(x => x.name === name);
    if (w) return w;
  }
  return null;
}

const ovSlot = (wname, i) => {
  const o = state.workoutOverrides[wname];
  return (o && o[i]) || null;
};
function setOverride(wname, i, patch){
  const o = state.workoutOverrides[wname] = state.workoutOverrides[wname] || {};
  o[i] = { ...(o[i] || {}), ...patch };
}
function clearOverride(wname, i){
  const o = state.workoutOverrides[wname];
  if (!o) return;
  delete o[i];
  if (!Object.keys(o).length) delete state.workoutOverrides[wname];   /* don't keep empties */
}
/* the effective exercise for a slot: prescribed line with any override applied */
function resolveSlot(w, i){
  const base = parseSetLine(w.sets[i]);
  const ov = ovSlot(w.name, i) || {};
  const swapped = ov.exercise != null;
  return {
    base,
    name:    swapped ? ov.exercise : base.name,
    sets:    ov.sets != null ? ov.sets : base.sets,
    reps:    ov.reps != null ? ov.reps : base.reps,
    suffix:  swapped ? '' : base.suffix,          /* "each" belongs to the original movement */
    swapped,
    overridden: swapped || ov.sets != null || ov.reps != null,
  };
}

/* ---- plain-language glossary for protocol jargon ---- */
const PROTOCOL_GLOSSARY = [
  ['Tabata',    /\btabata\b/i,     '20 seconds of all-out effort, 10 seconds of rest, repeated 8 times — one specific high-intensity interval format, not a general term.'],
  ['HIIT',      /\bhiit\b/i,       'High-Intensity Interval Training: short near-maximal bursts separated by short recoveries.'],
  ['EMOM',      /\bemom\b/i,       'Every Minute On the Minute: start the set when the clock hits the minute; whatever time is left over is your rest.'],
  ['AMRAP',     /\bamrap\b/i,      'As Many Reps As Possible: keep going until you can’t complete another rep with good form.'],
  ['Failure',   /\bfailure\b/i,    'Take the set until another clean rep isn’t possible. Stop at form breakdown — that’s the limit, not pain.'],
  ['Fartlek',   /\bfartlek\b/i,    'Swedish for "speed play": an unstructured run where you freely alternate faster and easier stretches by feel.'],
  ['Pyramid',   /\bpyramid\b/i,    'Work up in reps, distance or weight and then back down the same way — e.g. 1-2-3-2-1.'],
  ['Ladder',    /\bladder\b/i,     'Step the reps or distance up (or down) one rung each round, rather than repeating the same set.'],
  ['Tempo',     /\btempo\b/i,      'A sustained "comfortably hard" pace — you could speak in short phrases, not full sentences. Roughly one-hour race effort.'],
  ['Circuit',   /\bcircuits?\b/i,  'Move through every exercise back to back with little or no rest, then repeat the whole round.'],
  ['Intervals', /\bintervals?\b/i, 'Alternating hard efforts with easier recovery periods on a set work/rest clock.'],
  ['Zone 2',    /\bzone ?2\b/i,    'An easy aerobic pace you could hold a conversation at — the low-intensity base most endurance is built on.'],
];
function glossaryFor(w){
  const hay = [w.name, w.tag, ...w.sets].join(' · ');
  return PROTOCOL_GLOSSARY.filter(([, re]) => re.test(hay));
}

  state.recents = [f, ...state.recents.filter(x => x.name !== f.name)].slice(0, 20);

  const g = id => (current.querySelector('#'+id)||{}).value || '';

  /* ---- add-food browser ---- */
  const q = state.foodQuery.trim().toLowerCase();
  const cats = ['All', ...Object.keys(FOOD_DB), ...(state.customFoods.length?['Custom']:[])];
  const pool = foodPool();
  let results;
  if (state.foodView === 'recents')   results = state.recents;
  else if (state.foodView === 'favorites') results = state.favorites;
  else if (q)                         results = pool.filter(f => f.name.toLowerCase().includes(q));
  else if (state.foodCat === 'Custom')results = state.customFoods;
  else if (state.foodCat === 'All')   results = pool;
  /* || [] so an unknown category can never again take out the whole view */
  else                                results = (FOOD_DB[state.foodCat] || []).map(f => ({...f, cat:state.foodCat}));
  const shown = (results||[]).slice(0, 60);

  const foodRow = f => `
    <div class="fitem">
      <span class="add" data-act="openFood" data-fname="${encodeURIComponent(f.name)}" data-plain>+</span>
      <div style="flex:1;min-width:0" data-act="openFood" data-fname="${encodeURIComponent(f.name)}">
        <div style="font-weight:600;font-size:14px">${f.name}</div>
        <div class="mut" style="font-size:11.5px;margin-top:2px">${f.srv} · ${f.calories} kcal · P ${f.p} · C ${f.c} · F ${f.f}${(q||state.foodView!=='browse')&&f.cat?` · ${f.cat}`:''}</div>
      </div>
      <span class="fav ${isFav(f)?'on':''}" data-act="toggleFav" data-fname="${encodeURIComponent(f.name)}">${starIcon(isFav(f))}</span>
    </div>`;

  const browser = `
    <div class="sec">Add to <span class="em">${state.activeMeal}</span></div>
    <div class="mealtabs">
      ${Object.keys(state.meals).map(m=>`
        <span class="mealtab ${state.activeMeal===m?'on':''}" data-act="setMeal" data-meal="${m}">
          ${icon(MEAL_ICON[m], 15)} ${m}<span class="mt-k">${mealKcal(m)}</span>
        </span>`).join('')}
    </div>

    <div class="seg">
      <button class="${state.foodView==='browse'?'on':''}" data-act="setFoodView" data-view="browse">Search</button>
      <button class="${state.foodView==='recents'?'on':''}" data-act="setFoodView" data-view="recents">Recent</button>
      <button class="${state.foodView==='favorites'?'on':''}" data-act="setFoodView" data-view="favorites">Favorites ${icon('star', 13, { fill:true })}</button>
    </div>

    ${state.foodView==='browse' ? `
      <div class="search">
        <span class="mag">⌕</span>
        <input id="foodSearch" placeholder="Search ${pool.length} foods…" value="${state.foodQuery.replace(/"/g,'&quot;')}" autocomplete="off">
      </div>
      ${q ? '' : `<div class="tabs">${cats.map(c=>`
        <span class="tab ${state.foodCat===c?'on':''}" data-act="setFoodCat" data-cat="${encodeURIComponent(c)}">${c}</span>`).join('')}</div>`}
    ` : ''}

    ${shown.length ? shown.map(foodRow).join('')
      : state.foodView==='recents'
        ? `<div class="empty">No recent foods yet — log something and it lands here.</div>`
      : state.foodView==='favorites'
        ? `<div class="empty">No favorites yet. Tap the ${icon('star', 14)} on any food to save it.</div>`
      : q
        /* a failed search is the moment custom foods are actually wanted, so
           offer it here instead of leaving them to find the button below */
        ? `<div class="empty" style="padding:26px 16px 14px">
             No matches for “<b class="em">${escHtml(state.foodQuery.trim())}</b>”.
           </div>
           <button class="btn" data-act="addCustomFromSearch">
             + Add “${escHtml(state.foodQuery.trim())}” as a custom food
           </button>
           <p class="mut" style="text-align:center;font-size:12px;line-height:1.6;margin:10px 0 0">
             You’ll set the serving, calories and macros on the next screen.
           </p>`
        : `<div class="empty">Nothing to show here.</div>`}
    ${results && results.length > 60 ? `<div class="empty">Showing first 60 of ${results.length} — keep typing to narrow it down.</div>` : ''}

    <div style="margin-top:14px">
      <button class="btn" style="background:transparent;color:var(--accent);border:1px dashed var(--accent)" data-act="setFoodView" data-view="custom">+ Create custom food</button>
    </div>`;

  /* ---- custom food form ---- */
  const customForm = `
    <div class="sec">Create a custom food</div>
    <div class="card" style="padding:18px">
      <input class="inp" id="cfName" placeholder="Food name (e.g. Mom's lasagna)" value="${escHtml(state.customDraftName || '')}" style="width:100%;box-sizing:border-box;margin-bottom:10px">
      <input class="inp" id="cfSrv" placeholder="Serving (e.g. 1 slice, 100g)" style="width:100%;box-sizing:border-box;margin-bottom:10px">
      <div class="grid2" style="gap:10px">
        <input class="inp" id="cfCal" type="number" placeholder="Calories" style="box-sizing:border-box">
        <input class="inp" id="cfP" type="number" placeholder="Protein (g)" style="box-sizing:border-box">
        <input class="inp" id="cfC" type="number" placeholder="Carbs (g)" style="box-sizing:border-box">
        <input class="inp" id="cfF" type="number" placeholder="Fat (g)" style="box-sizing:border-box">
      </div>
      <div id="cfErr" class="mut" style="color:var(--danger);font-size:12px;margin-top:8px;min-height:14px"></div>
      <div class="grid2" style="gap:10px;margin-top:10px">
        <button class="btn" data-act="saveCustom">Save & log</button>
        <button class="btn" style="background:transparent;color:var(--accent);border:1px solid var(--accent)" data-act="setFoodView" data-view="browse">Cancel</button>
      </div>
    </div>`;

  /* ---- the slide-up food detail sheet ---- */
  const sheet = state.sheet ? (() => {
    const f = state.sheet.food, qty = state.sheet.qty;
    const presets = [0.5, 1, 1.5, 2, 3];
    return `
    <div class="sheet-bd" data-act="closeSheet" data-plain>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="Log ${escHtml(f.name)}"
           tabindex="-1" onclick="event.stopPropagation()">
        <div class="sheet-grab"></div>
        <div class="row">
          <div style="min-width:0">
            <div style="font-family:'Unbounded';font-weight:700;font-size:19px;line-height:1.2">${f.name}</div>
            <div class="mut" style="font-size:12.5px;margin-top:3px">${f.srv} · ${f.cat||''}</div>
          </div>
          <span style="display:flex;align-items:center;flex-shrink:0">
            <span class="fav ${isFav(f)?'on':''}" data-act="toggleFav" data-fname="${encodeURIComponent(f.name)}">${starIcon(isFav(f), 22)}</span>
            <button class="sheet-x" data-act="closeSheet" aria-label="Close">&times;</button>
          </span>
        </div>

        <div class="qstep">
          <button data-act="qtyStep" data-d="-0.5">−</button>
          <div class="qval">${fmtQty(qty)}<small>servings</small></div>
          <button data-act="qtyStep" data-d="0.5">+</button>
        </div>
        <div class="qpre">
          ${presets.map(pv=>`<span class="${qty===pv?'on':''}" data-act="qtyPreset" data-q="${pv}">${fmtQty(pv)}×</span>`).join('')}
        </div>

        <div class="macmini">
          <div><b class="em">${Math.round(f.calories*qty)}</b><span>kcal</span></div>
          <div><b>${Math.round(f.p*qty)}g</b><span>Protein</span></div>
          <div><b>${Math.round(f.c*qty)}g</b><span>Carbs</span></div>
          <div><b>${Math.round(f.f*qty)}g</b><span>Fat</span></div>
        </div>

        <button class="btn" data-act="confirmAdd">Add to ${state.activeMeal} · ${Math.round(f.calories*qty)} kcal</button>
      </div>
    </div>`;
  })() : '';

  const body = state.foodView === 'custom' ? customForm : browser;
  return summary + diary + body + sheet;
}

function fmtQty(q){
  if (q === Math.round(q)) return String(q);
  return q.toFixed(2).replace(/0$/,'').replace(/\.$/,'');
}

/* re-render only the food zone so the search box keeps focus & scroll holds */
let sheetWasOpen = false;
function refreshFoodOnly(){
  const zone = current.querySelector('#foodzone');
  if (!zone){ refresh(); return; }
  const input = current.querySelector('#foodSearch');
  const hadFocus = document.activeElement === input;
  const caret = input ? input.selectionStart : null;
  zone.innerHTML = foodZone();
  bindActions(current);
  bindFoodSearch(current);
  if (hadFocus){
    const ni = current.querySelector('#foodSearch');
    if (ni){ ni.focus(); if (caret!=null) ni.setSelectionRange(caret, caret); }
  }
  /* focus the dialog on the render it first appears — not on every qty tap,
     which would yank focus back off the +/- buttons */
  const dlg = current.querySelector('.sheet');
  if (dlg && !sheetWasOpen) dlg.focus();
  sheetWasOpen = !!state.sheet;
}

/* The query updates immediately (the state must never lag what's on screen),
   but the re-render — which rebuilds the summary, diary and up to 60 rows — is
   debounced so a fast typist gets one rebuild instead of one per character. */
let searchDebounce = null;
function bindFoodSearch(page){
  const input = page.querySelector('#foodSearch');
  if (input && !input._bound){
    input._bound = true;
    input.addEventListener('input', e => {
      state.foodQuery = e.target.value;
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(refreshFoodOnly, 120);
    });
  }
}
/* Mirror the typed email into pendingEmail so a background sync re-render
   can't wipe it, and toggle the CTA live without re-rendering (which would
   move the caret). */
function bindAccountInput(page){
  const input = page.querySelector('#authEmail');
  if (input && !input._bound){
    input._bound = true;
    input.addEventListener('input', e => {
      pendingEmail = e.target.value;
      const btn = page.querySelector('#sendBtn');
      if (btn) btn.disabled = state.authBusy || !validEmail(pendingEmail);
      const err = page.querySelector('#authErr');
      if (err && state.authMsg){ state.authMsg = ''; err.textContent = ''; }
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter'){
        const btn = page.querySelector('#sendBtn');
        if (btn && !btn.disabled) btn.click();
      }
    });
  }
}

function pageLog(){
  const d = state.done;
  const weekBurn = d.reduce((s,w)=>s+w.burn,0);
  if (!d.length) return `
    <div class="kicker rv">History</div>
    <h1 class="rv">Activity Log</h1>
    <p class="lede rv">Nothing burned yet. Open the library, run a session, and it lands here.</p>
    <div class="rv" style="margin-top:24px;max-width:320px">
      <button class="btn" data-act="open" data-route="workouts">Find a Workout</button>
    </div>`;
  return `
    <div class="kicker rv">History</div>
    <h1 class="rv">Activity Log</h1>
    ${state.plan ? `<p class="lede rv">That's <b class="em">${weekBurn} kcal</b> burned — about ${(weekBurn / state.plan.kcal).toFixed(1)} full days of your fuel target.</p>` : ''}
    <div class="card rv" style="display:flex;justify-content:space-around;text-align:center;padding:20px 10px;border-color:var(--ember-mid);margin-top:18px">
      <div class="stat"><b>${d.length}</b><span>Workouts</span></div>
      <div class="stat"><b>${weekBurn}</b><span>kcal Burned</span></div>
      <div class="stat"><b>${d.reduce((s,w)=>s+w.duration,0)}m</b><span>Active Time</span></div>
    </div>
    ${[...d].reverse().map((w,i)=>`
      <div class="card ${i%2 ? 'rv-r':'rv-l'}">
        <div class="row">
          <div><span class="pill">${w.tag}</span>
            <div class="big" style="font-size:16px;margin-top:7px">${w.name}</div>
            <div class="mut" style="font-size:12.5px;margin-top:3px">${w.duration} min · <span class="em">${w.burn} kcal</span></div>
          </div>
          <span class="gn" style="display:flex">${icon('check', 24, { label:'Completed' })}</span>
        </div>
      </div>`).join('')}`;
}

/* ================= ROUTES ================= */
const ROUTES = {
  goals:    () => nav('Goal Analysis', pageGoals),
  plan:     () => state.plan ? nav('Your Plan', pagePlanFull) : nav('Goal Analysis', pageGoals),
  calories: () => nav('Calorie Tracker', pageCalories),
  workouts: () => nav('Workout Library', pageWorkouts),
  libGoal:  (a) => nav(GOALS.find(x=>x.id===a.g).label, () => pageLibGoal(a)),
  libCat:   (a) => nav(CAT_LABEL[a.cat] || a.cat, () => pageLibCat(a)),
  log:      () => nav('Activity Log', pageLog),
  detail:   (a) => nav('Workout', () => pageDetail(a)),
  account:  () => nav('Account', pageAccount),
};

addEventListener('keydown', e => {
  /* sheets are modal — Escape closes them, and Back must not fire past one */
  if (e.key === 'Escape' && state.sheet){ state.sheet = null; refreshFoodOnly(); return; }
  if (e.key === 'Escape' && state.exSheet){ state.exSheet = null; refresh(); return; }
  if (e.key === 'ArrowLeft' && !state.sheet && !state.exSheet && e.target.tagName !== 'INPUT') goBack();
});

/* boot */
state.draft = {};
state.profile = null;
state.plan = null;
loadState();                 /* restore the durable slice if a valid one exists */
stack = [{ title:'Menu', build:pageMenu }];
mountPage(stack[0], 0);

/* Account sync is layered in AFTER the instant local boot — no loading screen.
   Once the async session check resolves (or a magic link completes in this
   tab), the current page silently re-renders with cloud data merged in. */
watchAuth(() => refresh());

/* ================= SERVICE WORKER =================
   Guarded behind an http(s) check so it's a silent no-op on file:// or in
   browsers without SW support. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

</script>
</body>
